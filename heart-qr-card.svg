<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0c20" />
      <stop offset="60%" stop-color="#140410" />
      <stop offset="100%" stop-color="#080206" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#e11d48" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="680" rx="30" fill="url(#bgGrad)" filter="url(#cardGlow)" stroke="#f43f5e" stroke-width="2" stroke-opacity="0.4" />

  <!-- Top Badge -->
  <rect x="135" y="45" width="230" height="28" rx="14" fill="#3b0f2a" stroke="#f43f5e" stroke-width="1.2" stroke-opacity="0.6" />
  <text x="250" y="63" fill="#fda4af" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="2">A PRIVATE GIFT FOR LEENA ❤️</text>

  <!-- Main Card Titles -->
  <text x="250" y="115" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="24" font-weight="900" text-anchor="middle">Scan To Unlock Our Story</text>
  <text x="250" y="142" fill="#fbcfe8" font-family="Georgia, serif" font-size="13" font-style="italic" text-anchor="middle">"A world crafted only for you, waiting to be unlocked."</text>

  <!-- QR Frame Outer Box -->
  <rect x="100" y="175" width="300" height="300" rx="28" fill="#ffffff" stroke="#f43f5e" stroke-width="4" filter="url(#cardGlow)" />

  <!-- Centered Embedded QR Code Image -->
  <image href="https://api.qrserver.com/v1/create-qr-code/?size=250x250&amp;data=https://mygirl-bday.netlify.app&amp;color=1a0513" x="125" y="200" width="250" height="250" />

  <!-- Center Floating Heart Emblem -->
  <circle cx="250" cy="325" r="28" fill="#e11d48" stroke="#ffffff" stroke-width="3" />
  <path d="M250 338 C242 332, 232 322, 232 312 C232 304, 238 299, 245 299 C248 299, 250 302, 250 302 C250 302, 252 299, 255 299 C262 299, 268 304, 268 312 C268 322, 258 332, 250 338 Z" fill="#ffffff" />

  <!-- Secret Passcode Box -->
  <rect x="125" y="505" width="250" height="36" rx="18" fill="#2d0b20" stroke="#fb7185" stroke-width="1.2" />
  <text x="250" y="528" fill="#fda4af" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle">
    🤫 Secret Passcode: <tspan fill="#ffffff" font-weight="900" letter-spacing="3"> 0710</tspan>
  </text>

  <!-- Footnote Love Signature -->
  <text x="250" y="585" fill="#f472b6" font-family="Brush Script MT, cursive, sans-serif" font-size="24" text-anchor="middle">
    Forever Yours, Jeevanantham ❤️
  </text>
  <text x="250" y="618" fill="#fda4af" font-family="'Outfit', sans-serif" font-size="10" font-weight="600" text-anchor="middle" opacity="0.6" letter-spacing="1">
    STRICTLY PRIVATE • LEENA &amp; JEEVA ONLY
  </text>
</svg>
